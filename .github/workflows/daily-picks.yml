name: Daily Stock Picks

# ============================================================
# Scheduled for 5:00am, 7:00am AND 12:00pm Sydney time every weekday.
# DST-aware: 6 UTC crons cover both AEST (UTC+10) and AEDT (UTC+11).
# GitHub often starts these hours late, so a time-guard job treats each
# slot as a window and lets the first arrival in each window run
# (scripts/sydney_guard.py). Short 5-10 second runs are normal skips.
#
# 5am  AEST = 19:00 UTC  |  5am  AEDT = 18:00 UTC
# 7am  AEST = 21:00 UTC  |  7am  AEDT = 20:00 UTC
# 12pm AEST = 02:00 UTC  |  12pm AEDT = 01:00 UTC
# ============================================================

on:
  schedule:
    - cron: '0 19 * * 1-5'   # 5am  AEST (Australian winter - Apr to Oct)
    - cron: '0 18 * * 1-5'   # 5am  AEDT (Australian summer - Oct to Apr)
    - cron: '0 21 * * 1-5'   # 7am  AEST (Australian winter - Apr to Oct)
    - cron: '0 20 * * 1-5'   # 7am  AEDT (Australian summer - Oct to Apr)
    - cron: '0  2 * * 2-6'   # 12pm AEST (Australian winter - Apr to Oct)
    - cron: '0  1 * * 2-6'   # 12pm AEDT (Australian summer - Oct to Apr)

  # Lets you trigger a manual run anytime from GitHub website
  workflow_dispatch:

# Required so the workflow can commit the JSON history back to the repo
permissions:
  contents: write

# ============================================================
# JOB 1 — Time guard
# Checks the Sydney clock and history. Only the first arrival in each slot runs.
# ============================================================
jobs:
  check-sydney-time:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      run_label:  ${{ steps.check.outputs.run_label }}
      run_emoji:  ${{ steps.check.outputs.run_emoji }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decide whether this run fills a slot (manual runs always proceed)
        id: check
        run: python3 scripts/sydney_guard.py

  # ============================================================
  # JOB 2 — Main engine
  # Only runs if the time guard says go.
  # ============================================================
  run-stock-picks:
    needs: check-sydney-time
    if: needs.check-sydney-time.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install required libraries
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Write config.py using your GitHub Secrets
      - name: Create config from secrets
        run: |
          cat > config.py << 'EOF'
          import os
          SLACK_WEBHOOK_URL  = os.environ.get('SLACK_WEBHOOK_URL', '')
          GMAIL_ADDRESS      = os.environ.get('GMAIL_ADDRESS', '')
          GMAIL_APP_PASSWORD = os.environ.get('GMAIL_APP_PASSWORD', '')
          FINNHUB_API_KEY    = os.environ.get('FINNHUB_API_KEY', '')
          ANTHROPIC_API_KEY  = os.environ.get('ANTHROPIC_API_KEY', '')
          SEND_EMAIL         = True
          SCORE_WEIGHTS = {
              'analyst':      0.30,
              'momentum':     0.25,
              'fundamentals': 0.25,
              'social':       0.10,
              'filing':       0.10,
          }
          STOP_LOSS_PCT     = 8
          TARGET_RETURN_PCT = 20
          HOLD_MONTHS       = 6
          TOP_N_PICKS       = 5
          EOF

      # 5. Run the engine — run label passed in so email subject reflects which run it is
      - name: Run recommendation engine
        env:
          FINNHUB_API_KEY:    ${{ secrets.FINNHUB_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_LABEL:          ${{ needs.check-sydney-time.outputs.run_label }}
          RUN_EMOJI:          ${{ needs.check-sydney-time.outputs.run_emoji }}
        run: python run.py

      # 6. Commit the updated JSON history back to the repo
      - name: Commit JSON history to repo
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions [Stock Bot]"
          git add data/
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: stock history $(TZ='Australia/Sydney' date '+%Y-%m-%d %H:%M %Z') — ${{ needs.check-sydney-time.outputs.run_label }} [automated]"
          git push

      # 7. Upload picks report as downloadable artifact
      - name: Upload picks report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-picks-${{ needs.check-sydney-time.outputs.run_label }}-${{ github.run_id }}
          path: picks/
          retention-days: 30
